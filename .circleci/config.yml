# CI and CD run in GitHub Actions (.github/workflows/). This no-op config stops CircleCI from failing until the
# CircleCI project is disabled.
version: 2.1
jobs:
  noop:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo "CI and CD run in GitHub Actions."
workflows:
  noop:
    jobs:
      - noop
