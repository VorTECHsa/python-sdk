# ---
# This is a Composite Action that sets up Python and installs the SDK with the given extras.
#
# Composite Actions docs: https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
# ---

name: 'Setup Python with deps'
description: 'Installs Python and the SDK with its extras, with the pip cache enabled'
inputs:
  extras:
    description: The setup.py extras to install, e.g. 'tests', 'binder', or 'deploy'.
    required: false
    default: tests
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    # uv installs the dependencies faster than pip. Its cache is keyed on setup.py. The extras are not in the key,
    # because the extras input can contain commas, which a cache key cannot. The uv cache holds wheels that any
    # extras combination can reuse.
    - name: Cache uv
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('setup.py') }}

    - name: Install the SDK with the ${{ inputs.extras }} extras
      shell: bash
      run: |
        python -m pip install uv==0.13.9
        uv pip install --system -e ".[${{ inputs.extras }}]"
